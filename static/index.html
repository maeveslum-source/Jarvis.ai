<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#03090b">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <title>JARVIS // CAPRI INTERFACE</title>
  <style>
    :root{
      --cyan:#00f6ff;--yellow:#fff500;--pink:#ff00ed;--green:#39ff14;
      --ink:#02090b;--panel:#030d10;--glow-cyan:0 0 7px #00f6ff,0 0 18px #00f6ff66;
      --glow-yellow:0 0 7px #fff500,0 0 18px #fff50066;
      --glow-pink:0 0 7px #ff00ed,0 0 18px #ff00ed66;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#020608;color:#d9ffe0}
    body{font:14px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;overflow-x:hidden}
    main{
      width:min(100%,520px);min-height:100svh;margin:0 auto;padding:8px;
      display:flex;flex-direction:column;gap:12px;background:
      radial-gradient(ellipse at 50% 45%,#25102c55 0,transparent 55%),#020608;
    }
    .terminal{
      min-height:158px;max-height:32svh;overflow:auto;border:2px solid var(--cyan);
      border-radius:4px;background:#020e10;padding:15px 16px;
      box-shadow:var(--glow-cyan),inset 0 0 12px #00f6ff12;
      scrollbar-color:#00f6ff #031013;
    }
    .prompt{color:var(--cyan);margin:0 0 12px;text-shadow:0 0 8px #00f6ff88}
    #chat{display:flex;flex-direction:column;gap:12px;min-height:100px}
    .bubble{white-space:pre-wrap;line-height:1.45;overflow-wrap:anywhere}
    .bubble.bot{color:#fff500;text-shadow:0 0 7px #fff50055}
    .bubble.user{color:#00f6ff;text-shadow:0 0 7px #00f6ff55}
    .bubble.bot:before{content:"CAPRI > ";color:var(--yellow)}
    .bubble.user:before{content:"> user: ";color:var(--cyan)}
    .avatar-panel{
      border:3px solid var(--yellow);border-radius:4px;padding:6px;
      background:#050609;box-shadow:var(--glow-yellow),inset 0 0 14px #fff50012;
    }
    .panel-head{height:30px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 3px 7px}
    .name-tag{
      color:#090900;background:var(--yellow);font-weight:900;font-size:12px;
      padding:5px 9px;border-radius:3px;text-shadow:none;letter-spacing:.4px;
    }
    #status{
      color:var(--green);border:1px solid var(--yellow);padding:4px 7px;
      font-size:10px;font-weight:bold;border-radius:3px;text-shadow:0 0 7px var(--green);
      white-space:nowrap;
    }
    #status:before{content:"● ";font-size:9px}
    .avatar-frame{
      height:clamp(170px,42svh,310px);border:2px solid var(--yellow);
      border-radius:3px;overflow:hidden;display:flex;align-items:center;justify-content:center;
      background:#08030a;box-shadow:inset 0 0 18px #ff00ed22;
    }
    .avatar-frame img{width:100%;height:100%;object-fit:cover;object-position:center 38%;display:block}
    .controls{display:flex;gap:6px;flex-wrap:wrap;padding:7px 2px 1px}
    button{
      min-height:30px;border:1px solid var(--cyan);border-radius:3px;background:#061014;
      color:var(--cyan);padding:5px 8px;font:inherit;font-size:11px;cursor:pointer;
      box-shadow:0 0 6px #00f6ff44;
    }
    button.active{border-color:var(--green);color:var(--green);box-shadow:0 0 7px #39ff1455}
    button:disabled{opacity:.45;cursor:not-allowed}
    form{
      display:flex;align-items:center;gap:9px;min-height:48px;padding:6px 8px;
      border:2px solid var(--pink);border-radius:3px;background:#050609;
      box-shadow:var(--glow-pink),inset 0 0 12px #ff00ed12;
    }
    .terminal-icon{
      flex:0 0 29px;height:25px;display:grid;place-items:center;border:1px solid var(--cyan);
      color:var(--cyan);font-weight:bold;font-size:17px;box-shadow:0 0 7px #00f6ff55;
    }
    textarea{
      min-width:0;flex:1;resize:none;height:28px;max-height:90px;overflow:auto;
      border:0;outline:0;background:transparent;color:var(--green);padding:5px 2px;
      font:inherit;font-size:12px;letter-spacing:.4px;
    }
    textarea::placeholder{color:#237c24;opacity:1}
    #send{border-color:var(--pink);color:#ff9af7;min-height:29px;padding:4px 9px}
    .hint{color:#397a43;font-size:10px;line-height:1.4;padding:0 3px}
    @media(min-width:560px){
      main{justify-content:center;min-height:100svh;padding:14px}
      .terminal{min-height:190px}
      .avatar-frame{height:330px}
    }
    @media(max-height:650px){
      .terminal{min-height:125px}
      .avatar-frame{height:clamp(145px,35svh,230px)}
    }
  </style>
</head>
<body>
<main>
  <section class="terminal" aria-label="JARVIS conversation terminal">
    <p class="prompt">&gt; user:</p>
    <div id="chat" aria-live="polite">
      <div class="bubble bot">Good day. JARVIS is online. What may I do for you?</div>
    </div>
  </section>

  <section class="avatar-panel" aria-label="JARVIS avatar and controls">
    <div class="panel-head">
      <span class="name-tag">JARVIS // TALKING</span>
      <span id="status">CONNECTED</span>
    </div>
    <div class="avatar-frame">
      <img src="/static/jarvis-avatar.jpeg" alt="JARVIS avatar">
    </div>
    <div class="controls">
      <button id="mic" type="button">🎙 SPEAK</button>
      <button id="voice" type="button" class="active" aria-pressed="true">🔊 VOICE ON</button>
      <button id="stop" type="button">■ STOP VOICE</button>
    </div>
  </section>

  <form id="form">
    <span class="terminal-icon" aria-hidden="true">&gt;_</span>
    <textarea id="message" placeholder="Type a command or question..." required rows="1"></textarea>
    <button id="send" type="submit">SEND</button>
  </form>
  <div class="hint" id="hint">Voice input uses your browser's speech recognition. Allow microphone access when asked.</div>
  <div class="hint">Prototype: chat and voice are active. Device actions and Gmail access are not connected yet.</div>
</main>

<script>
const form=document.querySelector("#form"),box=document.querySelector("#chat"),input=document.querySelector("#message");
const send=document.querySelector("#send"),mic=document.querySelector("#mic"),voiceBtn=document.querySelector("#voice");
const statusEl=document.querySelector("#status"),hint=document.querySelector("#hint");
let voiceOn=true,recognition=null,listening=false;

function add(text,who){
  const el=document.createElement("div");el.className="bubble "+who;el.textContent=text;
  box.appendChild(el);el.scrollIntoView({behavior:"smooth",block:"end"});return el;
}
function speak(text){
  if(!voiceOn||!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(text);utterance.rate=1.02;utterance.pitch=.92;
  const voices=speechSynthesis.getVoices();
  const preferred=voices.find(v=>/^en-GB/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));
  if(preferred)utterance.voice=preferred;speechSynthesis.speak(utterance);
}
async function sendMessage(message){
  if(!message.trim())return;
  add(message,"user");send.disabled=true;send.textContent="...";statusEl.textContent="THINKING";
  const wait=add("One moment...","bot");
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message})});
    const data=await r.json();if(!r.ok)throw new Error(data.detail||"Request failed");
    wait.textContent=data.reply||"I couldn't generate a reply.";speak(wait.textContent);
  }catch(err){wait.textContent="I couldn't reach the assistant: "+err.message;}
  finally{send.disabled=false;send.textContent="SEND";statusEl.textContent="CONNECTED";input.focus();}
}
form.addEventListener("submit",async e=>{e.preventDefault();const message=input.value.trim();input.value="";await sendMessage(message);});

const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SpeechRecognition){
  recognition=new SpeechRecognition();recognition.lang="en-GB";recognition.interimResults=true;recognition.continuous=false;
  recognition.onstart=()=>{listening=true;mic.textContent="🎙 LISTENING";statusEl.textContent="LISTENING";if("speechSynthesis"in window)speechSynthesis.cancel();};
  recognition.onresult=e=>{
    let finalText="",interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal)finalText+=e.results[i][0].transcript;else interim+=e.results[i][0].transcript;
    }
    input.value=(finalText||interim).trim();
    if(finalText.trim()){recognition.stop();sendMessage(finalText.trim());input.value="";}
  };
  recognition.onerror=e=>{hint.textContent="Microphone issue: "+e.error+". Check browser permissions and try again.";};
  recognition.onend=()=>{listening=false;mic.textContent="🎙 SPEAK";if(statusEl.textContent==="LISTENING")statusEl.textContent="CONNECTED";};
  mic.addEventListener("click",()=>{if(listening)recognition.stop();else{try{recognition.start();}catch(e){hint.textContent="Voice input is already starting. Please wait.";}}});
}else{
  mic.disabled=true;mic.textContent="🎙 UNAVAILABLE";
  hint.textContent="This browser does not expose speech recognition. Typing and spoken replies may still work.";
}
voiceBtn.addEventListener("click",()=>{
  voiceOn=!voiceOn;voiceBtn.classList.toggle("active",voiceOn);
  voiceBtn.setAttribute("aria-pressed",String(voiceOn));voiceBtn.textContent=voiceOn?"🔊 VOICE ON":"🔇 VOICE OFF";
  if(!voiceOn&&"speechSynthesis"in window)speechSynthesis.cancel();
});
document.querySelector("#stop").addEventListener("click",()=>{
  if("speechSynthesis"in window)speechSynthesis.cancel();if(listening)recognition?.stop();
});
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("/static/sw.js").catch(()=>{});
</script>
</body>
</html>
